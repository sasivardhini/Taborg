<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taborg - Tab Organizer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="8" height="8" rx="2" fill="#6366f1"/>
          <rect x="13" y="3" width="8" height="8" rx="2" fill="#8b5cf6"/>
          <rect x="3" y="13" width="8" height="8" rx="2" fill="#ec4899"/>
          <rect x="13" y="13" width="8" height="8" rx="2" fill="#f59e0b"/>
        </svg>
        <h1>Taborg</h1>
      </div>
      <div class="tab-count">
        <span id="tabCount">0</span> tabs
      </div>
    </header>

    <!-- Search Bar -->
    <div class="search-container">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M7 12C9.76142 12 12 9.76142 12 7C12 4.23858 9.76142 2 7 2C4.23858 2 2 4.23858 2 7C2 9.76142 4.23858 12 7 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M14 14L10.5 10.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <input
        type="text"
        id="searchInput"
        placeholder="Search tabs by title or URL..."
        autocomplete="off"
      >
      <button id="clearSearch" class="clear-btn hidden">×</button>
    </div>

    <!-- Quick Actions -->
    <div class="quick-actions">
      <button class="action-btn primary" id="saveSession">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M12.667 14H3.333A1.333 1.333 0 0 1 2 12.667V3.333A1.333 1.333 0 0 1 3.333 2h6.334L14 6.333v6.334A1.333 1.333 0 0 1 12.667 14z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M11.333 14v-5.333H4.667V14M4.667 2v4h5.333" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Save Session
      </button>
      <button class="action-btn" id="removeDuplicates">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M14 4.667L6 12.667 2 8.667" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Remove Duplicates
      </button>
      <button class="action-btn" id="closeInactive">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M12 4L4 12M4 4l8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Close Inactive
      </button>
    </div>

    <!-- Tab List -->
    <div class="tabs-section">
      <div class="section-header">
        <h2>Current Tabs</h2>
        <button class="group-btn" id="createGroup">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M7 2.333v9.334M2.333 7h9.334" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Create Group
        </button>
      </div>
      <div id="tabList" class="tab-list">
        <div class="loading">Loading tabs...</div>
      </div>
    </div>

    <!-- Saved Sessions -->
    <div class="sessions-section">
      <div class="section-header">
        <h2>Saved Sessions</h2>
        <span class="session-count" id="sessionCount">0</span>
      </div>
      <div id="sessionList" class="session-list">
        <div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="2" opacity="0.3"/>
            <path d="M24 16v16M16 24h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <p>No saved sessions yet</p>
          <span>Click "Save Session" to get started</span>
        </div>
      </div>
    </div>

    <!-- Stats Footer -->
    <footer class="stats">
      <div class="stat-item">
        <span class="stat-label">Duplicates Found</span>
        <span class="stat-value" id="duplicateCount">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Sessions Saved</span>
        <span class="stat-value" id="savedSessionCount">0</span>
      </div>
    </footer>
  </div>

  <!-- Modal for Save Session -->
  <div id="saveModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Save Session</h3>
        <button class="close-modal" id="closeModal">×</button>
      </div>
      <div class="modal-body">
        <label for="sessionName">Session Name</label>
        <input
          type="text"
          id="sessionName"
          placeholder="e.g., Research Project, Work Tasks..."
          autocomplete="off"
        >
        <div class="checkbox-group">
          <label>
            <input type="checkbox" id="includeAllWindows" checked>
            <span>Include all windows</span>
          </label>
          <label>
            <input type="checkbox" id="closeTabs">
            <span>Close tabs after saving</span>
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="cancelSave">Cancel</button>
        <button class="btn-primary" id="confirmSave">Save Session</button>
      </div>
    </div>
  </div>

  <!-- Modal for Create Group -->
  <div id="groupModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Create Tab Group</h3>
        <button class="close-modal" id="closeGroupModal">×</button>
      </div>
      <div class="modal-body">
        <label for="groupName">Group Name</label>
        <input
          type="text"
          id="groupName"
          placeholder="e.g., Social Media, Documentation..."
          autocomplete="off"
        >
        <label for="groupColor">Color</label>
        <div class="color-picker">
          <button class="color-option" data-color="grey" style="background: #5f6368"></button>
          <button class="color-option" data-color="blue" style="background: #1a73e8"></button>
          <button class="color-option selected" data-color="red" style="background: #d93025"></button>
          <button class="color-option" data-color="yellow" style="background: #f9ab00"></button>
          <button class="color-option" data-color="green" style="background: #188038"></button>
          <button class="color-option" data-color="pink" style="background: #d01884"></button>
          <button class="color-option" data-color="purple" style="background: #9334e6"></button>
          <button class="color-option" data-color="cyan" style="background: #007b83"></button>
        </div>
        <label>Select Tabs</label>
        <div id="tabSelection" class="tab-selection">
          <!-- Populated dynamically -->
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="cancelGroup">Cancel</button>
        <button class="btn-primary" id="confirmGroup">Create Group</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
