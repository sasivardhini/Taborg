<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#gradient)"/>

  <!-- Grid pattern representing organized tabs -->
  <rect x="28" y="28" width="32" height="32" rx="6" fill="white" opacity="0.9"/>
  <rect x="68" y="28" width="32" height="32" rx="6" fill="white" opacity="0.75"/>
  <rect x="28" y="68" width="32" height="32" rx="6" fill="white" opacity="0.75"/>
  <rect x="68" y="68" width="32" height="32" rx="6" fill="white" opacity="0.6"/>

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
</svg>
